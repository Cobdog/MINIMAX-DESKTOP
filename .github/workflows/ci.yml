name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Form-adapter node (task k271ykk): the math/golden suite runs on
      # python3+numpy — numpy is not guaranteed on runner images, so install
      # it explicitly (same precedent as the ffmpeg apt-get below).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # License audit (task 68rnn84): dep SPDX classification + the
      # never-vendor-what-we-cannot-ship registry invariant.
      - run: pnpm license:audit
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke:server
      # Canvas document store (Phase 0, task oiavqh8): runs AFTER build — the
      # suite boots the built server on a scratch home (same pattern as the
      # gate-local test:storage). Migration 002 golden fixture, §6 legacy
      # import, GC fork-edge adversarials, §7 archive round-trip, §4 FTS.
      - run: pnpm test:documents
      # Managed ComfyUI runtime (increment 1): stub-checkout suite — needs
      # neither python nor a real checkout; the python section self-skips.
      - run: pnpm test:runtime
      # Local-first fetcher (task hgjbea2): consent-gated network fetches with
      # the transport mocked throughout — catalog integrity, pin stamping,
      # verification, placement policy, routes. Zero real network in CI.
      - run: pnpm test:fetcher
      # Form-adapter node (task k271ykk): python math/golden suite (numpy
      # installed above) + the server-side detection/registry/catalog tests.
      - run: pnpm test:lora-form
      # IK pose rig (task 41ebvfo): pure client modules through the VM
      # harness — IK solvers, palette-exact draw ops vs goldens, keypoint
      # JSON round-trip, grid snapping. No engine, no browser needed.
      - run: pnpm test:poserig
      # Camera path compiler (task ving89w): the bruxosdovfx v19.1 port —
      # golden prompts byte-compared against upstream-generated fixtures
      # (committed; the Python generator lives beside them for regeneration).
      # No python needed at test time.
      - run: pnpm test:camera
      # ffmpeg is required by the filmstrip capability (wave 2d: server-side
      # sprite-sheet thumbnails + the e2e video fixture). ubuntu-latest does
      # NOT ship it by default. Decision: install it rather than let the
      # tests skip on CI — the filmstrip route and the 11th e2e test then run
      # for real, and future benchmark work needs ffmpeg too. Runners without
      # ffmpeg still SKIP gracefully with a logged reason (test-side guard).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm test:filmstrip
      # NO browser download: the Playwright config launches the runner's
      # SYSTEM browser (ubuntu images ship Google Chrome + Chromium) and
      # throws with a one-line reason if none is found. Local dev needs a
      # system Chromium/Chrome too, or MINIMAX_TEST_BROWSER=path (see README).
      - run: pnpm test:e2e
      # Vision phase 1 (capture only): writes a screenshot bundle under
      # test-results/vision/. Judgment (JUDGE.md subagent) never runs in CI;
      # `pnpm vision:report` is the local pre-release gate for the verdicts.
      - run: pnpm test:vision
