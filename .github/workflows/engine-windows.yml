# Windows leg of the EngineProcess supervision contract (wave 2c): the
# taskkill /T /F tree-kill path, the python.exe unbuffered flags, and the
# portability of the fixtures only execute on Windows. Deliberately minimal —
# server build only, no browser install (the ubuntu CI leg owns e2e).
#
# DEMOTED TO SCHEDULED-ONLY (maintainer directive, 2026-09-21, folded into
# PR #35 / eg6l3v5): "Windows tests take the back seat too, I am in a linux
# environment, I think windows testing can get pushed to very low priority."
# The leg no longer runs on PRs OR merge-to-main — weekly cadence +
# workflow_dispatch for on-demand runs, so OS-difference coverage survives
# at near-zero standing cost. Nothing is deleted: the manifest's windows
# flags (scripts/ci-map.cjs SUITES[].windows + windowsSuites/windowsPython)
# stay as data for this leg and any future re-wiring into the PR path.
# Posture: every PR = the scoped Linux select→fast leg; merge-to-main =
# full + contracts, all Linux.
#
# The scheduled run is the FULL set — engine-process, runtime, fetcher,
# instance, benchmarks — engine-dependence unchanged (transport
# mocked, no ComfyUI needed).
name: Engine CI (Windows)

on:
  schedule:
    # Weekly, Monday 03:00 UTC (low-traffic window).
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  engine:
    runs-on: windows-latest
    env:
      # The benchmark suite's python bridge (task cp96zdm): python.exe, not python3.
      BENCH_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Form-adapter node (task k271ykk): the math/golden suite runs on
      # python3+numpy on both legs (the first-party install path is also
      # symlink-sensitive — exactly why this suite runs on Windows too).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:server
      # The OS-sensitive suites as ONE vitest invocation (vitest filters):
      #   engine-process — EngineProcess supervision (taskkill /T /F);
      #   runtime        — managed ComfyUI runtime (stub checkouts);
      #   fetcher        — local-first fetcher: symlink placement + tar;
      #   instance       — external-instance integration (9om4bi9): the
      #                    symlink/path-sensitive install surface;
      #   benchmarks     — harness offline suite (BENCH_PYTHON=python above).
      #   (lora-form was removed with the suite — Wave 2 R-12, 2026-09-21:
      #    modelForms.ts and its tests died with the local model scan.)
      - name: OS-sensitive suites (full weekly set)
        run: pnpm exec vitest run engine-process runtime fetcher instance benchmarks
