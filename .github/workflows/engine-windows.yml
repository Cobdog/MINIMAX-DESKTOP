# Windows leg of the EngineProcess supervision contract (wave 2c): the
# taskkill /T /F tree-kill path, the python.exe unbuffered flags, and the
# portability of the fixtures only execute on Windows. Deliberately minimal —
# server build only, no browser install (the ubuntu CI leg owns e2e).
name: Engine CI (Windows)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Form-adapter node (task k271ykk): the math/golden suite runs on
      # python3+numpy on both legs (the first-party install path is also
      # symlink-sensitive — exactly why this suite runs on Windows too).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check numpy
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:server
      - run: node scripts/test-engine-process.cjs
      # Managed ComfyUI runtime (increment 1): the stub-checkout suite needs
      # neither python nor a real checkout, so both Windows legs run in full.
      - run: node scripts/test-runtime.cjs
      # Local-first fetcher (task hgjbea2): both legs run it in full — symlink
      # placement and the tar extractor are exactly the OS-sensitive paths.
      - run: node scripts/test-fetcher.cjs
      # External-instance integration (task 9om4bi9): the module sections run
      # in full here — the external custom-nodes install target is exactly a
      # symlink/path-sensitive surface. The route sections self-skip without
      # the web build (same NOTE pattern as the fetcher suite).
      - run: node scripts/test-instance.cjs
      # Form-adapter suite (task k271ykk): math + golden (numpy) and the
      # first-party pack install path on Windows symlinks/junctions.
      - run: node scripts/test-lora-form.cjs
      # Benchmark harness offline suite (task cp96zdm): registry/leaderboard,
      # CLI, catalog bridge, mock-candidate build smoke (python+numpy above —
      # the suite passes BENCH_PYTHON=python on Windows), metric fixtures.
      - run: node scripts/test-benchmarks.cjs
        env:
          BENCH_PYTHON: python
